<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch - Movie Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#141414] text-white font-sans min-h-screen flex flex-col">
    <header class="text-center py-12 px-4 bg-[#1f1f1f] border-b border-[#2c2c2c]">
        <h1 class="text-4xl font-bold mb-2 text-[#e50914]">🎬 CineSearch</h1>
        <p class="text-gray-400 mb-6">Explore your favorite movies instantly</p>
        <div class="flex justify-center max-w-md mx-auto">
            <input type="text" id="search-input" placeholder="Search for a movie..."
                class="flex-1 px-4 py-3 bg-[#2b2b2b] text-white placeholder-gray-500 rounded-l-md outline-none focus:ring-2 focus:ring-[#e50914]">
            <button id="search-btn"
                class="bg-[#e50914] hover:bg-[#f40612] px-6 py-3 font-semibold rounded-r-md transition-colors cursor-pointer">
                Search
            </button>
        </div>
    </header>
    <main class="flex-1 p-8 max-w-7xl mx-auto w-full">
        <section id="movie-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <div class="col-span-full text-center text-gray-500 text-lg mt-12">
                Type a movie title above and click search to get started!
            </div>
        </section>
    </main>
    <div id="movie-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center z-50 hidden">
        <div class="bg-[#1f1f1f] p-8 rounded-lg max-w-2xl w-[90%] relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <span id="close-modal" class="absolute top-4 right-6 text-3xl text-gray-400 hover:text-white cursor-pointer">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
